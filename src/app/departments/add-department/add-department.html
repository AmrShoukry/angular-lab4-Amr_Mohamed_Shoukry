<section class="card shadow-sm border-0">
  <div class="card-header bg-primary text-white">
    <h1 class="h5 mb-0">Create Department</h1>
  </div>

  <div class="card-body">
    <form class="row g-3" [formGroup]="form" (ngSubmit)="submit()">
      <div class="col-12">
        <label class="form-label" for="department-name">Name</label>
        <input id="department-name" class="form-control" type="text" formControlName="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
        <div class="text-danger small mt-1">Department name is required and must be at least 2 characters.</div>
        }
      </div>

      @if (error()) {
      <div class="col-12">
        <div class="alert alert-danger mb-0">{{ error() }}</div>
      </div>
      }

      <div class="col-12">
        <button class="btn btn-primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Saving...' : 'Create Department' }}
        </button>
      </div>
    </form>
  </div>
</section>
