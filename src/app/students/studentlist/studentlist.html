<div class="col-12">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      Students
    </div>

    <div class="card-body">
      <div class="container mt-3">

        <div class="mb-3">
          <app-add-student></app-add-student>
        </div>

        <div class="table-responsive">

          <table class="table table-striped table-hover align-middle">

            <thead class="table-dark">
              <tr>
                <th>Name</th>
                <th>Age</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>

            <tbody>

              @for (student of students(); track student.id) {
              <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td class="text-center">
                  <button class="btn btn-outline-primary btn-sm" (click)="selectStudent(student)">
                    Select
                  </button>
                  <button class="btn btn-outline-primary btn-sm" (click)="deleteStudent(student)">
                    Delete
                  </button>

                </td>
              </tr>
              }

              @empty {
              <tr>
                <td colspan="3" class="text-center text-muted py-3">
                  No Students
                </td>
              </tr>
              }

            </tbody>

          </table>

        </div>

        <!-- Selected Student Section -->
        @if (selectedStudent()) {
        <div class="mt-4">

          <div class="card shadow-sm border-0">
            <div class="card-body">

              <app-student-details></app-student-details>

              <div class="mt-3">
                <app-student-edit></app-student-edit>
              </div>

            </div>
          </div>

        </div>
        }

      </div>
    </div>
  </div>
</div>
