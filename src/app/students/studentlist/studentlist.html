<section class="card shadow-sm border-0">
  <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between flex-wrap gap-2">
    <h1 class="h5 mb-0">Students</h1>
    <button class="btn btn-light btn-sm" type="button" (click)="createStudent()">Create Student</button>
  </div>

  <div class="card-body">
    @if (loading()) {
    <div class="alert alert-info mb-0">Loading students...</div>
    } @else if (error()) {
    <div class="alert alert-danger mb-0">{{ error() }}</div>
    } @else {
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (student of students(); track student.id) {
          <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td>{{ departmentName(student) }}</td>
            <td class="text-end">
              <div class="btn-group btn-group-sm" role="group" aria-label="Student actions">
                <button class="btn btn-outline-primary" type="button" (click)="viewStudent(student)">Details</button>
                <button class="btn btn-outline-secondary" type="button" (click)="editStudent(student)">Edit</button>
                <button class="btn btn-outline-danger" type="button" (click)="deleteStudent(student)">Delete</button>
              </div>
            </td>
          </tr>
          } @empty {
          <tr>
            <td colspan="4" class="text-center text-muted py-4">No students found.</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
    }
  </div>
</section>
